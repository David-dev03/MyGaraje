<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGaraje - Garaje</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="navbar">
        <div class="navbar-brand">
            <a href="index.html">MyGaraje</a>
        </div>
        <nav aria-label="Navegación principal">

                <li><a href="#vista-listado" data-vista="vista-listado" class="activo">Garaje</a></li>
                <li><a href="#vista-registro" data-vista="vista-registro">Registro</a></li>
                <li><a href="#vista-usuarios" data-vista="vista-usuarios">Usuarios</a></li>
                <li><a href="#vista-contacto" data-vista="vista-contacto">Contacto</a></li>
                <li><a href="#vista-mensajes" data-vista="vista-mensajes">Mensajes</a></li>

        </nav>
    </header>

    <main class="contenedor">

            <div id="contenedor-motos" class="grid-motos"></div>

        <section id="vista-registro" class="vista oculto">

        </section>
        <section id="vista-usuarios" class="vista oculto">
            <h1>Usuarios</h1>
        </section>
        <section id="vista-contacto" class="vista oculto">
            <h1>Contacto</h1>
        </section>
        <section id="vista-mensajes" class="vista oculto">
            <h1>Mensajes enviados</h1>
        </section>

    <script type="module" src="js/main.js"></script>
